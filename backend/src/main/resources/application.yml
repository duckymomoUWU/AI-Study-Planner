spring:
  application:
    name: ai-study-planner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/study_planner}
    username: ${DB_USER:study_planner}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
