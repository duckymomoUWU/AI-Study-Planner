spring:
  application:
    name: ai-study-planner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/study_planner}
    username: ${DB_USER:study_planner}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
