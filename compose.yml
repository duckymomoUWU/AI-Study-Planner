services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: study_planner
      POSTGRES_USER: study_planner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - study_planner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_planner -d study_planner"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  study_planner_data:
