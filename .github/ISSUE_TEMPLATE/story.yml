name: User story
description: Mô tả giá trị và tiêu chí chấp nhận
labels: [story]
body:
  - type: textarea
    id: value
    attributes:
      label: Người dùng và giá trị
      placeholder: Là ..., tôi muốn ... để ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: Given ... When ... Then ...; thêm trường hợp sai/lỗi
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Epic, dependencies, scope
      description: Liên kết Epic và story phụ thuộc; Developers ước lượng khi refinement.
  - type: textarea
    id: evidence
    attributes:
      label: Kiểm chứng dự kiến
      description: Cách chứng minh giá trị và AC; áp dụng DoD trong docs/team-board.md.
